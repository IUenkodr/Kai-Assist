name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Generate Android APK (FOSS)'
        type: boolean
        required: true
        default: true
      build_dmg:
        description: 'Generate macOS DMG'
        type: boolean
        required: true
        default: true
      build_msi:
        description: 'Generate Windows MSI'
        type: boolean
        required: true
        default: true
      build_deb:
        description: 'Generate Debian .deb package'
        type: boolean
        required: true
        default: true
      build_rpm:
        description: 'Generate RPM package'
        type: boolean
        required: true
        default: true
      build_tarball:
        description: 'Generate Linux tarball (Kai-linux-x86_64.tar.gz)'
        type: boolean
        required: true
        default: true
      build_appimage:
        description: 'Generate Linux AppImage'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------
  #  APK
  # -------------------------------------------------------
  apk:
    if: ${{ github.event_name == 'push' || (github.event.inputs.build_apk == 'true') }}
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android Build Tools
        run: |
          android sdk install build-tools/36.0.0 build-tools/29.0.3
      - name: Build APK
        run: bash ./gradlew :a --stacktrace
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.KEYSTORE_B64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release-signed.apk

  # -------------------------------------------------------
  #  DMG (macOS)
  # -------------------------------------------------------
  dmg:
    if: ${{ github.event_name == 'push' || (github.event.inputs.build_dmg == 'true') }}
    name: Generate DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build DMG
        run: bash ./gradlew packageReleaseDmg --stacktrace
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-package
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

  # -------------------------------------------------------
  #  MSI (Windows)
  # -------------------------------------------------------
  msi:
    if: ${{ github.event_name == 'push' || (github.event.inputs.build_msi == 'true') }}
    name: Generate MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build MSI
        run: ./gradlew packageReleaseMsi --stacktrace
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

  # -------------------------------------------------------
  #  DEB (Debian/Ubuntu)
  # -------------------------------------------------------
  deb:
    if: ${{ github.event_name == 'push' || (github.event.inputs.build_deb == 'true') }}
    name: Generate DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build DEB
        run: ./gradlew packageReleaseDeb --stacktrace
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

  # -------------------------------------------------------
  #  RPM (Red‑Hat/Fedora)
  # -------------------------------------------------------
  rpm:
    if: ${{ github.event_name == 'push' || (github.event.inputs.build_rpm == 'true') }}
    name: Generate RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        run: ./gradlew packageReleaseRpm --stacktrace
      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: composeApp/build/compose/binaries/main-release/rpm/*.rpm

  # -------------------------------------------------------
  #  Linux Tarball
  # -------------------------------------------------------
  linux-tar:
    if: ${{ github.event_name == 'push' || (github.event.inputs.build_tarball == 'true') }}
    name: Generate Linux Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create tarball
        run: |
          cd composeApp/build/compose/binaries/main-release/app
          tar czf "$GITHUB_WORKSPACE/Kai-linux-x86_64.tar.gz" Kai
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-package
          path: Kai-linux-x86_64.tar.gz

  # -------------------------------------------------------
  #  AppImage (Linux)
  # -------------------------------------------------------
  appimage:
    if: ${{ github.event_name == 'push' || (github.event.inputs.build_appimage == 'true') }}
    name: Generate AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Pack AppImage
        run: |
          ./gradlew packageReleaseAppimage --stacktrace
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: composeApp/build/compose/binaries/main-release/appimage/*.AppImage
